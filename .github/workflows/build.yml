# Сборка и тесты на каждый push и pull request. Деплоя нет (R29i).
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка и тесты
        run: npm test
